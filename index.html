<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Apex Production Report</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

<div class="container">

    <div class="header">

        <h1>Apex Production Report</h1>

        <p>Daily Production Shift Report</p>

    </div>


    <!-- =================================================
         SHIFT INFORMATION
    ================================================== -->

    <div class="card">

        <h2>Shift Information</h2>


        <div class="grid">


            <div class="form-group">

                <label for="reportDate">
                    Production Date
                </label>

                <input
                    type="date"
                    id="reportDate"
                    required
                >

            </div>


            <div class="form-group">

                <label for="shift">
                    Shift
                </label>

                <select id="shift" required>

                    <option value="">
                        Select Shift
                    </option>

                    <option value="1st">
                        1st Shift
                    </option>

                    <option value="2nd">
                        2nd Shift
                    </option>

                    <option value="3rd">
                        3rd Shift
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="unit">
                    Unit
                </label>

                <select id="unit" required>

                    <option value="">
                        Select Unit
                    </option>

                    <option value="Unit 1">
                        Unit 1
                    </option>

                    <option value="Unit 2">
                        Unit 2
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="supervisor">
                    Supervisor Name
                </label>

                <input
                    type="text"
                    id="supervisor"
                    placeholder="Enter supervisor name"
                    required
                >

            </div>


        </div>

    </div>



    <!-- =================================================
         MACHINE REPORT
    ================================================== -->

    <div class="card">

        <h2>Machine Report</h2>


        <div class="grid">


            <div class="form-group">

                <label for="process">
                    Process
                </label>

                <select id="process">

                    <option value="">
                        Select Process
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="machine">
                    Machine
                </label>

                <select id="machine">

                    <option value="">
                        Select Machine
                    </option>

                </select>

            </div>


        </div>


        <!-- MACHINE ENTRY AREA -->

        <div id="machineForm">

            <p class="empty-message">
                Select a process and machine to enter production data.
            </p>

        </div>


        <button
            type="button"
            id="saveMachineReport"
            class="secondary-button"
        >
            Add Machine
        </button>


    </div>



    <!-- =================================================
         CURRENT SHIFT ENTRIES
    ================================================== -->

    <div class="card">

        <h2>Current Shift Entries</h2>

        <div id="entries">

            <p class="empty-message">
                No machines added yet.
            </p>

        </div>

    </div>



    <!-- =================================================
         SUBMIT SHIFT
    ================================================== -->

    <div class="submit-area">

        <button
            type="button"
            id="submitShiftReport"
            class="primary-button"
        >
            SUBMIT SHIFT REPORT
        </button>

    </div>


</div>


<script
    type="module"
    src="app.js">
</script>


</body>

</html>
