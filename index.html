<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Production Report</title>
    <!-- Webpage Icon / Favicon -->
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/org593vv/image/upload/v1790600713/Apex_webpage_Icon.png">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/org593vv/image/upload/v1790600713/Apex_webpage_Icon.png">
    
    <link rel="stylesheet" href="style.css">
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div class="container">
        <header class="main-header">
            <div class="logo-title">
                <img src="https://res.cloudinary.com/org593vv/image/upload/v1790600713/Apex_webpage_Icon.png" alt="Apex Logo" class="header-logo">
                <h1>Apex Production Report</h1>
            </div>
            <div class="header-actions">
                <button type="button" id="openTargetModalBtn" class="btn btn-secondary">+ Add Today's Target</button>
            </div>
        </header>

        <!-- Production Report Form -->
        <form id="productionForm" class="card">
            <div class="form-row">
                <div class="form-group">
                    <label for="prodDate">Production Date</label>
                    <input type="date" id="prodDate" required>
                </div>
                <div class="form-group">
                    <label for="shift">Shift</label>
                    <select id="shift" required>
                        <option value="">Select Shift</option>
                        <option value="1st Shift">1st Shift (08:00 - 16:00)</option>
                        <option value="2nd Shift">2nd Shift (16:00 - 00:00)</option>
                        <option value="3rd Shift">3rd Shift (00:00 - 08:00)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="unit">Unit</label>
                    <select id="unit" required>
                        <option value="">Select Unit</option>
                        <option value="Unit 1">Unit 1</option>
                        <option value="Unit 2">Unit 2</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="process">Process</label>
                    <select id="process" required>
                        <option value="">Select Process</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="machine">Machine</label>
                    <select id="machine" required>
                        <option value="">Select Machine</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="operator">Operator Name</label>
                    <input type="text" id="operator" placeholder="Operator Name" required>
                </div>
                <div class="form-group">
                    <label for="jobName">Job Name / Order</label>
                    <input type="text" id="jobName" placeholder="Job Name">
                </div>
                <div class="form-group">
                    <label for="outputKg">Production Output (kg)</label>
                    <input type="number" step="0.01" id="outputKg" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label for="wasteKg">Wastage (kg)</label>
                    <input type="number" step="0.01" id="wasteKg" placeholder="0.00" value="0">
                </div>
            </div>

            <div class="form-group full-width">
                <label for="remarks">Remarks / Notes</label>
                <textarea id="remarks" rows="2" placeholder="Optional remarks..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Submit Production Report</button>
            <div id="submitMessage" class="message-banner"></div>
        </form>
    </div>

    <!-- Target Entry Modal -->
    <div id="targetModal" class="modal-backdrop" style="display: none;">
        <div class="modal-content card">
            <div class="modal-header">
                <h3>ADD TODAY'S TARGET</h3>
                <button type="button" class="close-modal-btn" id="closeTargetModalBtn">&times;</button>
            </div>
            <form id="targetForm">
                <div class="form-group">
                    <label for="targetProdDate">Production Date</label>
                    <input type="date" id="targetProdDate" required>
                </div>
                <div class="form-group">
                    <label for="targetUnit">Unit</label>
                    <select id="targetUnit" required>
                        <option value="Unit 1">Unit 1</option>
                        <option value="Unit 2">Unit 2</option>
                    </select>
                </div>

                <div id="targetProcessInputs">
                    <!-- Dynamic inputs rendered via JS -->
                </div>

                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">[ SAVE TARGET ]</button>
                </div>
                <div id="targetSaveMessage" class="message-banner"></div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
