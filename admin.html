<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin - Apex Production Report</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="admin-header">

    <div>

        <h1>
            🛠️ Production Report Admin
        </h1>

        <p>
            Correct and manage existing production reports
        </p>

    </div>


    <div class="header-actions">

        <a
            href="manager.html"
            class="header-button"
        >
            📊 Manager Dashboard
        </a>

        <button
            type="button"
            id="refreshButton"
            class="header-button refresh-button"
        >
            🔄 Refresh
        </button>

    </div>

</header>





<!-- =====================================================
     MAIN
===================================================== -->

<main class="admin-container">


    <!-- =================================================
         FILTER SECTION
    ================================================== -->

    <section class="filter-section">

        <h2>
            🔎 Find Report
        </h2>


        <div class="filter-grid">


            <div class="form-group">

                <label for="filterDate">
                    Production Date
                </label>

                <input
                    type="date"
                    id="filterDate"
                >

            </div>


            <div class="form-group">

                <label for="filterShift">
                    Shift
                </label>

                <select id="filterShift">

                    <option value="">
                        All Shifts
                    </option>

                    <option value="A">
                        Shift A
                    </option>

                    <option value="B">
                        Shift B
                    </option>

                    <option value="C">
                        Shift C
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="filterUnit">
                    Unit
                </label>

                <select id="filterUnit">

                    <option value="">
                        All Units
                    </option>

                    <option value="Unit 1">
                        Unit 1
                    </option>

                    <option value="Unit 2">
                        Unit 2
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="searchText">
                    Search
                </label>

                <input
                    type="text"
                    id="searchText"
                    placeholder="Machine, product, supervisor..."
                >

            </div>


        </div>


        <div class="filter-buttons">

            <button
                type="button"
                id="clearFilters"
                class="secondary-button"
            >
                ✖ Clear Filters
            </button>

        </div>


    </section>





    <!-- =================================================
         STATUS
    ================================================== -->

    <div
        id="loadingMessage"
        class="message-box"
    >
        Loading reports...
    </div>


    <div
        id="reportCount"
        class="report-count"
    >
    </div>


    <!-- =================================================
         REPORT LIST
    ================================================== -->

    <section
        id="reportsContainer"
        class="reports-container"
    >
    </section>


</main>





<!-- =====================================================
     EDIT MODAL
===================================================== -->

<div
    id="editModal"
    class="modal hidden"
>


    <div class="modal-content">


        <!-- MODAL HEADER -->

        <div class="modal-header">

            <div>

                <h2>
                    ✏️ Edit Production Report
                </h2>

                <p id="editingReportId">
                </p>

            </div>


            <button
                type="button"
                id="closeModal"
                class="close-button"
            >
                ×
            </button>

        </div>





        <!-- REPORT HEADER -->

        <section class="edit-section">

            <h3>
                📋 Report Information
            </h3>


            <div class="edit-grid">


                <div class="form-group">

                    <label for="editDate">
                        Production Date
                    </label>

                    <input
                        type="date"
                        id="editDate"
                    >

                </div>


                <div class="form-group">

                    <label for="editShift">
                        Shift
                    </label>

                    <select id="editShift">

                        <option value="A">
                            Shift A
                        </option>

                        <option value="B">
                            Shift B
                        </option>

                        <option value="C">
                            Shift C
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="editUnit">
                        Unit
                    </label>

                    <select id="editUnit">

                        <option value="Unit 1">
                            Unit 1
                        </option>

                        <option value="Unit 2">
                            Unit 2
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="editSupervisor">
                        Supervisor
                    </label>

                    <input
                        type="text"
                        id="editSupervisor"
                        placeholder="Supervisor name"
                    >

                </div>


            </div>

        </section>





        <!-- MACHINE ENTRIES -->

        <section class="edit-section">

            <div class="machine-section-header">

                <h3>
                    ⚙️ Machine Entries
                </h3>

                <button
                    type="button"
                    id="addMachineButton"
                    class="add-button"
                >
                    ➕ Add Machine
                </button>

            </div>


            <div
                id="machinesEditor"
                class="machines-editor"
            >
            </div>

        </section>





        <!-- MODAL FOOTER -->

        <div class="modal-footer">


            <button
                type="button"
                id="cancelEdit"
                class="cancel-button"
            >
                Cancel
            </button>


            <button
                type="button"
                id="deleteReportButton"
                class="delete-report-button"
            >
                🗑️ Delete Entire Report
            </button>


            <button
                type="button"
                id="saveChangesButton"
                class="save-button"
            >
                💾 Save Changes
            </button>


        </div>


    </div>

</div>





<!-- =====================================================
     FIREBASE / ADMIN JS
===================================================== -->

<script
    type="module"
    src="admin.js"
></script>


</body>

</html>
