<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin - Apex Production Report</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="admin-header">

    <div>

        <h1>
            🛠️ Production Report Admin
        </h1>

        <p>
            Correct and manage existing production reports
        </p>

    </div>


    <div class="header-actions">

        <a
            href="manager.html"
            class="header-button"
        >
            📊 Manager Dashboard
        </a>

        <button
            type="button"
            id="refreshButton"
            class="header-button refresh-button"
        >
            🔄 Refresh
        </button>

    </div>

</header>

<!-- =====================================================
     NAVIGATION TABS
====================================================== -->
<nav class="dashboard-tabs" style="display: flex; gap: 10px; padding: 15px 20px; background: #fff; border-bottom: 1px solid #e5e7eb;">
    <button
        type="button"
        class="dashboard-tab active"
        data-tab="reports"
        style="padding: 8px 16px; cursor: pointer; font-weight: bold;">
        📊 Production Reports
    </button>
    <button
        type="button"
        class="dashboard-tab"
        data-tab="wip"
        style="padding: 8px 16px; cursor: pointer; font-weight: bold;">
        📦 Pending WIP Rolls
    </button>
</nav>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="admin-container">


    <!-- =================================================
         FILTER SECTION
    ================================================== -->

    <section class="filter-section">

        <h2>
            🔎 Find Report
        </h2>


        <div class="filter-grid">


            <div class="form-group">

                <label for="filterDate">
                    Production Date
                </label>

                <input
                    type="date"
                    id="filterDate"
                >

            </div>


            <div class="form-group">

                <label for="filterShift">
                    Shift
                </label>

               <input
    type="text"
    id="filterShift"
    placeholder="Enter shift to search"
>

            </div>


            <div class="form-group">

                <label for="filterUnit">
                    Unit
                </label>

                <select id="filterUnit">

                    <option value="">
                        All Units
                    </option>

                    <option value="Unit 1">
                        Unit 1
                    </option>

                    <option value="Unit 2">
                        Unit 2
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="searchText">
                    Search
                </label>

                <input
                    type="text"
                    id="searchText"
                    placeholder="Machine, product, supervisor..."
                >

            </div>


        </div>


        <div class="filter-buttons">

            <button
                type="button"
                id="clearFilters"
                class="secondary-button"
            >
                ✖ Clear Filters
            </button>

        </div>


    </section>





    <!-- =================================================
         STATUS
    ================================================== -->

    <div
        id="loadingMessage"
        class="message-box"
    >
        Loading reports...
    </div>


    <div
        id="reportCount"
        class="report-count"
    >
    </div>


    <!-- =================================================
         REPORT LIST
    ================================================== -->

    <section
        id="reportsContainer"
        class="reports-container"
    >
    </section>


</main>





<!-- =====================================================
     EDIT MODAL
===================================================== -->

<div
    id="editModal"
    class="modal hidden"
>


    <div class="modal-content">


        <!-- MODAL HEADER -->

        <div class="modal-header">

            <div>

                <h2>
                    ✏️ Edit Production Report
                </h2>

                <p id="editingReportId">
                </p>

            </div>


            <button
                type="button"
                id="closeModal"
                class="close-button"
            >
                ×
            </button>

        </div>





        <!-- REPORT HEADER -->

        <section class="edit-section" style="background: #f9fafb; padding: 15px; border-radius: 8px; margin-bottom: 20px;">

            <h3 style="margin-bottom: 12px; font-size: 16px;">
                📋 Report Information
            </h3>


            <div class="edit-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">


                <div class="form-group" style="display: flex; flex-direction: column; gap: 5px;">

                    <label for="editDate" style="font-size: 13px; font-weight: 600;">
                        Production Date
                    </label>

                    <input
                        type="date"
                        id="editDate"
                        style="padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; width: 100%; box-sizing: border-box;"
                    >

                </div>


                <div class="form-group" style="display: flex; flex-direction: column; gap: 5px;">

                    <label for="editShift" style="font-size: 13px; font-weight: 600;">
                        Shift
                    </label>

                    <input
                        type="text"
                        id="editShift"
                        placeholder="Enter Shift"
                        style="padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; width: 100%; box-sizing: border-box;"
                    >

                </div>


                <div class="form-group" style="display: flex; flex-direction: column; gap: 5px;">

                    <label for="editUnit" style="font-size: 13px; font-weight: 600;">
                        Unit
                    </label>

                    <select id="editUnit" style="padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; width: 100%; box-sizing: border-box; background: #fff;">
                        <option value="Unit 1">Unit 1</option>
                        <option value="Unit 2">Unit 2</option>
                    </select>

                </div>


                <div class="form-group" style="display: flex; flex-direction: column; gap: 5px;">

                    <label for="editSupervisor" style="font-size: 13px; font-weight: 600;">
                        Supervisor
                    </label>

                    <input
                        type="text"
                        id="editSupervisor"
                        placeholder="Supervisor name"
                        style="padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; width: 100%; box-sizing: border-box;"
                    >

                </div>


            </div>

        </section>




        <!-- MACHINE ENTRIES -->

        <section class="edit-section">

            <div class="machine-section-header">

                <h3>
                    ⚙️ Machine Entries
                </h3>

                <button
                    type="button"
                    id="addMachineButton"
                    class="add-button"
                >
                    ➕ Add Machine
                </button>

            </div>


            <div
                id="machinesEditor"
                class="machines-editor"
            >
            </div>

        </section>





        <!-- MODAL FOOTER -->

        <div class="modal-footer">


            <button
                type="button"
                id="cancelEdit"
                class="cancel-button"
            >
                Cancel
            </button>


            <button
                type="button"
                id="deleteReportButton"
                class="delete-report-button"
            >
                🗑️ Delete Entire Report
            </button>


            <button
                type="button"
                id="saveChangesButton"
                class="save-button"
            >
                💾 Save Changes
            </button>


        </div>


    </div>

</div>





<!-- =====================================================
     FIREBASE / ADMIN JS
===================================================== -->

<script
    type="module"
    src="admin.js"
></script>


</body>

</html>
